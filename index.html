<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - ريهام</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .card {
            background: white;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 {
            color: #b76e79;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
            color: #555;
        }
        .names {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
        }
        .footer {
            margin-top: 30px;
            font-size: 16px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>حفل زفافنا</h1>
        <p>بكل حب وبمحض السعادة والسرور، نتشرف بدعوتكم لحضور حفل زفافنا ومشاركتنا أجمل لحظات عمرنا.</p>
        
        <div class="names">
            <span>ريهام</span> & <span>[اسمك]</span>
        </div>

        <p>الإثنين، الموافق [التاريخ]</p>
        <p>بقانـة / القاعة [اسم القاعة]</p>

        <div class="footer">
            <p>وجودكم هو ارحم وأجمل هدية لنا ❤️</p>
        </div>
    </div>

</body>
</html>
